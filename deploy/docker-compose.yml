services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: abdcshare
      POSTGRES_PASSWORD: abdcshare
      POSTGRES_DB: abdcshare
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abdcshare"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    env_file: [../.env]
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    profiles: ["full"]

  worker:
    build: { context: .., dockerfile: deploy/Dockerfile.worker }
    env_file: [../.env]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    profiles: ["full"]

  web:
    build: { context: .., dockerfile: deploy/Dockerfile.web }
    env_file: [../.env]
    ports: ["3000:3000"]
    depends_on: [api]
    profiles: ["full"]

volumes:
  pgdata:
