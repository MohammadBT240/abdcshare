# clamd for abdcshare library scanning (S3, D24/D26). Mounted read-only into clamav/clamav:1.4.
Foreground yes
LogTime yes
LogFile /var/log/clamav/clamd.log
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
# Library files are ≤100 MB; the worker streams them with INSTREAM.
StreamMaxLength 110M
MaxFileSize 110M
MaxScanSize 400M
# Don't load a second copy of the signatures while reloading — halves peak RAM (as QEledger D232).
ConcurrentDatabaseReload no
SelfCheck 3600
