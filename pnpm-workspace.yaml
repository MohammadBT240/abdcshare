packages:
  - "apps/*"
  - "packages/*"

# pnpm 11: explicit build-script decisions (must be real booleans, not placeholders).
allowBuilds:
  '@scarf/scarf': false # optional telemetry — no build needed
  msgpackr-extract: false # optional native accelerator — JS fallback is fine
  sharp: true # Next.js image optim — installs prebuilt binaries (no compile)
  unrs-resolver: true # native module resolver (eslint import tooling) — prebuilt binaries

# Packages newer than the supply-chain release-age gate that we accept.
minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.101.3'
  - '@tanstack/react-query@5.101.3'
