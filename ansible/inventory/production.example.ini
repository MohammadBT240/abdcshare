# Copy to production.ini (gitignored).
#
# Prod + staging share one VM: two inventory groups, same ansible_host.
#
# Deploy prod (nginx play needs sudo — add --ask-become-pass if the deploy user prompts):
#   ansible-playbook --ask-vault-pass --ask-become-pass -i inventory/production.ini playbooks/deploy.yml -l abdcshare_prod -e image_tag=$(git rev-parse HEAD)
# Deploy staging:
#   ansible-playbook --ask-vault-pass --ask-become-pass -i inventory/production.ini playbooks/deploy.yml -l abdcshare_staging -e image_tag=$(git rev-parse HEAD)
#
# Nginx + TLS only (after the stack is up):
#   ansible-playbook --ask-vault-pass --ask-become-pass -i inventory/production.ini playbooks/nginx.yml

[abdcshare_prod]
abdcshare-prod ansible_host=YOUR_VM_IP ansible_user=deploy

[abdcshare_staging]
abdcshare-staging ansible_host=YOUR_VM_IP ansible_user=deploy
